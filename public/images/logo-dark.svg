<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 40" width="170" height="40" role="img" aria-label="DeRivian Care">
  <!-- Mark: teal rounded square with D -->
  <rect x="0" y="0" width="40" height="40" rx="9.6" fill="#5cc4a7"/>
  <text x="20" y="28" text-anchor="middle"
    font-family="Raleway, 'Helvetica Neue', Arial, sans-serif"
    font-weight="700" font-size="22" fill="#050a08">D</text>
  <!-- Wordmark: DeRivian / CARE — white, for dark backgrounds (footer) -->
  <text x="52" y="23"
    font-family="Raleway, 'Helvetica Neue', Arial, sans-serif"
    font-weight="700" font-size="22" letter-spacing="-0.5"
    fill="#ffffff">DeRivian</text>
  <text x="53" y="37"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-weight="500" font-size="10" letter-spacing="2.2"
    fill="#ffffff" opacity="0.72">CARE</text>
</svg>
